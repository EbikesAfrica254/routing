logging:
  level:
    com.ebikes.routing: DEBUG

management:
  endpoint:
    health:
      show-details: always

routing:
  valhalla:
    base-url: http://localhost:8002

spring:
  config:
    import: configtree:${user.home}/Work/EBikes/secrets/routing/

  datasource:
    url: jdbc:postgresql://localhost:5432/ebikes_routing
    username: postgres

  rabbitmq:
    host: localhost
    port: 5672
    username: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/ebikes
          jwk-set-uri: http://localhost:8080/realms/ebikes/protocol/openid-connect/certs