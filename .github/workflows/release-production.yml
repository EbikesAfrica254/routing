name: Release Production

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: release-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-production:
    name: release-production
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Derive image coordinates
        id: image
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD 2>/dev/null || echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Find CI run for release SHA
        id: ci-run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              status: 'success',
              per_page: 1
            });
            if (runs.data.total_count === 0) {
              core.setFailed('No successful CI run found for SHA: ' + context.sha);
              return;
            }
            core.setOutput('run_id', runs.data.workflow_runs[0].id.toString());

      - name: Download JAR layers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jar-layers-${{ github.sha }}
          run-id: ${{ steps.ci-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: extracted/

      - name: Checkout Dockerfile only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            Dockerfile
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Move extracted layers to build context
        run: mv extracted/* .

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@006813a119ae0fdeb70ae00f16cda21ee6f2ff3d

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver-opts: network=host

      - name: Build and push production image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.ECR_REGISTRY }}/ebikes/routing:${{ steps.image.outputs.version }}
            ${{ vars.ECR_REGISTRY }}/ebikes/routing:sha-${{ steps.image.outputs.short_sha }}
            ${{ vars.ECR_REGISTRY }}/ebikes/routing:latest
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.created=${{ steps.image.outputs.build_date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ vars.ECR_REGISTRY }}/ebikes/routing:buildcache
          cache-to: type=registry,ref=${{ vars.ECR_REGISTRY }}/ebikes/routing:buildcache,mode=max

      - name: Publish summary
        run: |
          echo "## Production Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.image.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ vars.ECR_REGISTRY }}/routing:${{ steps.image.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ vars.ECR_REGISTRY }}/routing:sha-${{ steps.image.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ vars.ECR_REGISTRY }}/routing:latest\`" >> "$GITHUB_STEP_SUMMARY"