name: Publish Dev

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: publish-dev-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish-dev:
    name: publish-dev
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Derive image coordinates
        id: image
        run: |
          echo "short_sha=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Download JAR layers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jar-layers-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: extracted/

      - name: Write Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM eclipse-temurin:21-jre-alpine

          RUN apk add --no-cache shadow tzdata

          WORKDIR /app

          RUN addgroup -S appgroup && \
              adduser -S appuser -G appgroup && \
              mkdir -p /app/logs && \
              chown -R appuser:appgroup /app

          COPY --chown=appuser:appgroup dependencies/ ./
          COPY --chown=appuser:appgroup spring-boot-loader/ ./
          COPY --chown=appuser:appgroup snapshot-dependencies/ ./
          COPY --chown=appuser:appgroup application/ ./

          ENV TZ=Africa/Nairobi

          EXPOSE 8086

          USER appuser

          CMD ["java", "-XX:+UseContainerSupport", "-XX:MaxRAMPercentage=75.0", "org.springframework.boot.loader.launch.JarLauncher"]
          EOF

      - name: Move extracted layers to build context
        run: mv extracted/* .

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@006813a119ae0fdeb70ae00f16cda21ee6f2ff3d

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push dev image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.ECR_REGISTRY }}/routing:dev
            ${{ vars.ECR_REGISTRY }}/routing:sha-${{ steps.image.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=dev
            org.opencontainers.image.created=${{ steps.image.outputs.build_date }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ vars.ECR_REGISTRY }}/routing:buildcache
          cache-to: type=registry,ref=${{ vars.ECR_REGISTRY }}/routing:buildcache,mode=max

      - name: Publish summary
        run: |
          echo "## Dev Publish Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.event.workflow_run.head_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ vars.ECR_REGISTRY }}/routing:dev\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ vars.ECR_REGISTRY }}/routing:sha-${{ steps.image.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"